# Difficulty profiles for b2b_saas_procurement_v1
# ---------------------------------------------------------------------------
# Each profile controls the signal/noise characteristics of the generated
# dataset. Higher difficulty = more realistic noise, missing data, and class
# imbalance, making the supervised task harder.

intro:
  description: >
    Clean signal, minimal noise. Suitable for learning basic ML concepts
    and verifying that a pipeline runs end to end.
  # Probability that the true mechanism drives the outcome (vs. noise)
  signal_strength: 0.90
  # Scale multiplier applied to additive Gaussian noise in continuous features
  noise_scale: 0.10
  # Fraction of feature values set to missing (NaN)
  missing_rate: 0.02
  # Fraction of rows that are statistical outliers
  outlier_rate: 0.01
  # Positive-class rate for converted_within_90_days
  conversion_rate_range: [0.30, 0.45]
  # Strength of buying-committee-friction effects
  committee_friction: 0.10
  # Correlate observable categories with latent traits to produce category-level
  # conversion signal.  Each entry maps an observable field to a latent trait and
  # per-value additive boosts (applied after initial latent sampling in
  # build_population).  Values validated by spike experiment (scale 1.8).
  category_latent_correlations:
    seniority:
      latent_trait: latent_contact_authority
      boosts:
        individual_contributor: -0.27
        manager: -0.09
        director: 0.09
        vp: 0.22
        c_suite: 0.36
    estimated_revenue_band:
      latent_trait: latent_account_fit
      boosts:
        "$1M-$10M": -0.18
        "$10M-$50M": 0.0
        "$50M-$200M": 0.18
        "$200M+": 0.32
    lead_source:
      latent_trait: latent_engagement_propensity
      boosts:
        sdr_outbound: -0.14
        inbound_marketing: 0.09
        partner_referral: 0.22

intermediate:
  description: >
    Realistic signal-to-noise ratio. Suitable for portfolio projects,
    courses, and kaggle-style competitions.
  signal_strength: 0.70
  noise_scale: 0.30
  missing_rate: 0.08
  outlier_rate: 0.04
  conversion_rate_range: [0.18, 0.28]
  committee_friction: 0.30
  # Correlate observable categoricals with latent traits so that segment-level
  # conversion rates differ meaningfully — without this, all segments convert
  # at the same ~22% rate and categorical features have near-zero ML signal.
  # Boosts are smaller than intro to reflect the higher noise level.
  category_latent_correlations:
    seniority:
      latent_trait: latent_contact_authority
      boosts:
        individual_contributor: -0.20
        manager: -0.07
        director: 0.07
        vp: 0.17
        c_suite: 0.28
    estimated_revenue_band:
      latent_trait: latent_account_fit
      boosts:
        "$1M-$10M": -0.15
        "$10M-$50M": 0.0
        "$50M-$200M": 0.15
        "$200M+": 0.27
    # lead_source → latent_account_fit (not engagement_propensity) so the boost
    # lands on a latent that actually carries weight in the conversion hazard.
    # Partner referrals bring pre-qualified, well-fit accounts; cold outbound skews lower.
    lead_source:
      latent_trait: latent_account_fit
      boosts:
        sdr_outbound: -0.14
        inbound_marketing: 0.06
        partner_referral: 0.22
    # Stronger boosts — latent_budget_readiness has weight 1.0 in the hazard,
    # so we need larger deltas to produce visible spread.
    process_maturity_band:
      latent_trait: latent_budget_readiness
      boosts:
        low: -0.28
        medium: 0.05
        high: 0.32
    industry:
      latent_trait: latent_account_fit
      boosts:
        life_sciences: 0.14
        financial_services: 0.10
        professional_services: 0.02
        healthcare_non_clinical: -0.08
    # buyer_role → latent_contact_authority: champion (full-cycle internal advocate)
    # should convert highest; end_user lowest (no authority to close).
    buyer_role:
      latent_trait: latent_contact_authority
      boosts:
        champion: 0.22
        economic_buyer: 0.10
        technical_evaluator: -0.05
        end_user: -0.18
    # employee_band → latent_account_fit: mid-market sweet spot (500-999) for
    # procurement automation; very small and very large companies are harder closes.
    employee_band:
      latent_trait: latent_account_fit
      boosts:
        "200-499": -0.08
        "500-999": 0.15
        "1000-1999": 0.10
        "2000+": -0.05
    # region → latent_account_fit: Northeast gets a slight edge — Boston-based
    # vendor with regional network and brand recognition.
    region:
      latent_trait: latent_account_fit
      boosts:
        Northeast: 0.10
        US: -0.05

advanced:
  description: >
    High noise, realistic class imbalance, and significant missing data.
    Suitable for ML research and realistic benchmark construction.
  signal_strength: 0.50
  noise_scale: 0.55
  missing_rate: 0.18
  outlier_rate: 0.08
  conversion_rate_range: [0.08, 0.15]
  committee_friction: 0.55
